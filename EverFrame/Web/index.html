<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作记录控制</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><header><span class="eyebrow">用户负责工作，我们负责记住</span><h1 id="name">工作记录</h1><p id="notice" role="status">请输入手机设置页显示的配对码。</p></header><section id="pair"><form id="pair-form"><label>6 位配对码<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off"></label><button>配对电脑</button></form></section><div id="control" hidden><section><h2 id="recording">等待状态</h2><div class="stats"><article><span>连续记录</span><strong id="elapsed">—</strong></article><article><span>今日记录</span><strong id="today">—</strong></article><article><span>素材占用</span><strong id="used">—</strong></article><article><span>剩余空间</span><strong id="free">—</strong></article></div><p id="ai"></p><div class="actions"><button id="start">开始记录</button><button id="stop" class="secondary">停止记录</button></div><div class="actions"><button data-keep="10">保留最近10分钟</button><button data-keep="30">保留最近30分钟</button><button data-keep="60">保留最近60分钟</button></div></section><section><h2>今日 AI 时间轴</h2><div id="timeline"></div><button id="daily">生成今日总结</button><div id="summary"></div></section><section><h2>素材</h2><p>播放、删除和导出请在手机操作。</p><div id="clips"></div></section><footer><button id="logout" class="secondary">退出配对</button><p>原始视频只在手机保存。请保持手机 App 在前台并接通电源。</p></footer></div></main></body></html>
